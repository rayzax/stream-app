<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream: Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D10;color:#E8EAED;font-family:Inter,system-ui,sans-serif}
a{color:#3B82F6}a:hover{color:#60A5FA}
h1{font-family:"Space Grotesk",system-ui,sans-serif;margin:0;font-weight:700}
.field{box-sizing:border-box;width:100%;min-height:44px;padding:0 14px;background:#1C2128;color:#E8EAED;border:1px solid #2A313A;border-radius:10px;font:inherit}
.field:focus{outline:2px solid #3B82F6;outline-offset:2px}
.btn{box-sizing:border-box;width:100%;min-height:44px;background:#3B82F6;color:#fff;border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#2563EB}
</style>
</helmet>
<main style="box-sizing:border-box;min-height:900px;display:flex;align-items:center;justify-content:center;padding:32px;background:#0B0D10">
  <section aria-labelledby="login-title" style="box-sizing:border-box;width:100%;max-width:400px;background:#14181D;border:1px solid #1C2128;border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
      <div style="font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:32px">Stream</div>
      <h1 id="login-title" style="font-size:20px">Sign in</h1>
    </div>
    <form style="display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;flex-direction:column;gap:8px">
        <label for="password" style="font-size:14px;font-weight:500;color:#E8EAED">Password</label>
        <input id="password" class="field" type="password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
    <p style="margin:0;text-align:center;color:#9AA3AD;font-size:13px">Single-user private access</p>
  </section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
