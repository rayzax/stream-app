<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream: Mobile Sports</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D10;color:#E8EAED;font-family:Inter,system-ui,sans-serif}
a{color:#3B82F6}
h2{font-family:"Space Grotesk",system-ui,sans-serif;margin:0;font-weight:700}
.tabbar a{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;color:#9AA3AD;text-decoration:none;font-size:12px;font-weight:500}
.tabbar a[aria-current="page"]{color:#3B82F6}
.card{background:#14181D;border:1px solid #1C2128;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pill{display:inline-block;background:#EF4444;color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:2px 8px}
.play{display:flex;align-items:center;justify-content:center;min-height:44px;width:100%;box-sizing:border-box;background:#3B82F6;color:#fff;border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="box-sizing:border-box;width:390px;height:844px;display:flex;flex-direction:column;background:#0B0D10;overflow:hidden">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:#14181D;border-bottom:1px solid #1C2128">
    <div style="font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:22px">Stream</div>
    <button type="button" aria-label="Search" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:#1C2128;color:#E8EAED;border:1px solid #2A313A;border-radius:999px;cursor:pointer">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    </button>
  </header>

  <main style="flex:1 1 auto;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:24px">
    <sc-for list="{{leagues}}" as="lg">
      <section aria-labelledby="{{lg.id}}" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:baseline;gap:8px">
          <h2 id="{{lg.id}}" style="font-size:18px">Live {{lg.name}}</h2>
          <span style="color:#9AA3AD;font-size:13px">{{lg.count}} live</span>
        </div>
        <sc-for list="{{lg.games}}" as="g">
          <article class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <span style="color:#9AA3AD;font-size:13px;font-weight:600">{{g.network}}</span>
              <span class="pill">LIVE</span>
            </div>
            <div style="font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;font-weight:700">{{g.matchup}}</div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
              <span style="font-size:17px;font-weight:700;font-variant-numeric:tabular-nums">{{g.score}}</span>
              <span style="color:#9AA3AD;font-size:13px">{{g.clock}}</span>
            </div>
            <a href="Player.dc.html" class="play" aria-label="Play {{g.matchup}} on {{g.network}}" style="text-decoration:none">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;stroke:none;margin-right:8px"><path d="M7 4.5v15l12-7.5z"/></svg>
              Watch
            </a>
          </article>
        </sc-for>
      </section>
    </sc-for>
    <p style="margin:0 0 8px;color:#9AA3AD;font-size:13px;text-align:center">No live MLB games right now</p>
  </main>

  <nav aria-label="Sections" class="tabbar" style="display:flex;background:#14181D;border-top:1px solid #1C2128;padding-bottom:8px">
    <a href="MobileSports.dc.html" aria-current="page">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 3 2.5 14 0 17M12 3.5c-2.5 3-2.5 14 0 17"/></svg>
      Sports
    </a>
    <a href="TV.dc.html">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 3l3 3 3-3"/></svg>
      TV
    </a>
    <a href="Movies.dc.html">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>
      Movies
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
leagues: [
{ id: 'm-nfl', name: 'NFL', count: 3, games: [
{ matchup: 'Bears at Packers', score: '17 – 14', clock: 'Q3 · 8:42', network: 'FOX' },
{ matchup: 'Chiefs at Broncos', score: '14 – 7', clock: 'Q2 · 4:50', network: 'CBS' },
{ matchup: 'Cowboys at Eagles', score: '7 – 3', clock: 'Q1 · 11:02', network: 'NBC' } ] },
{ id: 'm-cfb', name: 'CFB', count: 2, games: [
{ matchup: 'Michigan at Ohio State', score: '21 – 17', clock: 'Q3 · 6:10', network: 'ABC' },
{ matchup: 'Alabama at LSU', score: '14 – 21', clock: 'Q4 · 2:33', network: 'ESPN' } ] },
{ id: 'm-nba', name: 'NBA', count: 1, games: [
{ matchup: 'Celtics at Knicks', score: '54 – 51', clock: 'Q2 · 5:31', network: 'ESPN' } ] },
{ id: 'm-nhl', name: 'NHL', count: 1, games: [
{ matchup: 'Bruins at Rangers', score: '2 – 1', clock: 'P2 · 10:44', network: 'TNT' } ] },
{ id: 'm-soc', name: 'Soccer', count: 1, games: [
{ matchup: 'Liverpool at Arsenal', score: '1 – 1', clock: '67′', network: 'Peacock' } ] }
]
};
}
}
</script>
</body>
</html>
