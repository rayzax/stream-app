<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream: Player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D10;color:#E8EAED;font-family:Inter,system-ui,sans-serif}
a{color:#3B82F6}a:hover{color:#60A5FA}
h1,h2{font-family:"Space Grotesk",system-ui,sans-serif;margin:0;font-weight:700}
.ctl{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:#1C2128;color:#E8EAED;border:1px solid #2A313A;border-radius:10px;cursor:pointer}
.ctl:hover{background:#252C35}
.ctl[aria-pressed="true"]{border-color:#3B82F6;color:#3B82F6}
.game{display:flex;align-items:center;gap:12px;padding:12px;background:#14181D;border:1px solid #1C2128;border-radius:12px;color:#E8EAED;text-decoration:none}
.game[aria-current="true"]{border-color:#3B82F6}
.game:hover{background:#1C2128}
.pill{display:inline-block;background:#EF4444;color:#fff;font-size:12px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:3px 10px}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="box-sizing:border-box;min-height:1000px;background:#0B0D10">
  <header style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 32px;padding:12px 32px;background:#14181D;border-bottom:1px solid #1C2128">
    <a href="Main.dc.html" style="font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:24px;color:#E8EAED;text-decoration:none">Stream</a>
    <nav aria-label="Back navigation" style="display:flex;gap:8px">
      <a href="Main.dc.html" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;color:#9AA3AD;text-decoration:none;font-weight:500">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Back to Sports
      </a>
    </nav>
    <span style="margin-left:auto;display:inline-flex;align-items:center;gap:8px;color:#9AA3AD;font-size:14px;background:#0B0D10;border:1px solid #2A313A;border-radius:999px;padding:4px 12px">Streaming via Cloud</span>
  </header>

  <div style="box-sizing:border-box;display:flex;flex-wrap:wrap;gap:24px;padding:24px 32px 40px">
    <section aria-label="Video player" style="flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px">
      <div style="position:relative;width:100%;aspect-ratio:16/9;background:#14181D;border:1px solid #1C2128;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center">
        <button type="button" aria-label="Play" style="display:flex;align-items:center;justify-content:center;width:88px;height:88px;background:#3B82F6;color:#fff;border:0;border-radius:999px;cursor:pointer">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:36px;height:36px;fill:currentColor;stroke:none;margin-left:4px"><path d="M7 4.5v15l12-7.5z"/></svg>
        </button>
      </div>

      <div role="toolbar" aria-label="Player controls" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#14181D;border:1px solid #1C2128;border-radius:12px;padding:8px">
        <button type="button" class="ctl" aria-label="Pause">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
        </button>
        <button type="button" class="ctl" aria-label="Volume">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        </button>
        <span class="pill" aria-label="Live">LIVE</span>
        <span style="margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px">
          <button type="button" class="ctl" aria-label="Quality" style="width:auto;padding:0 12px;font:inherit;font-size:14px;font-weight:600">1080p</button>
          <button type="button" class="ctl" aria-label="Picture in picture">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1"/></svg>
          </button>
          <button type="button" class="ctl" aria-label="Enter fullscreen">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </span>
      </div>

      <div style="display:flex;flex-direction:column;gap:4px">
        <h1 style="font-size:24px">Bears at Packers · FOX</h1>
        <p style="margin:0;color:#9AA3AD;font-size:14px">Q3 · 8:42 · Score 17 – 14</p>
      </div>
    </section>

    <aside aria-labelledby="other-live" style="flex:0 1 340px;min-width:260px;display:flex;flex-direction:column;gap:12px">
      <h2 id="other-live" style="font-size:18px">Other live NFL</h2>
      <sc-for list="{{others}}" as="o">
        <a class="game" href="Player.dc.html" aria-current="{{o.current}}">
          <span style="flex:1 1 auto;min-width:0">
            <span style="display:block;font-weight:600">{{o.matchup}}</span>
            <span style="display:block;color:#9AA3AD;font-size:13px">{{o.score}} · {{o.clock}} · {{o.network}}</span>
          </span>
          <span class="pill">LIVE</span>
        </a>
      </sc-for>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
return {
others: [
{ matchup: 'Bears at Packers', score: '17 – 14', clock: 'Q3 · 8:42', network: 'FOX', current: 'true' },
{ matchup: 'Chiefs at Broncos', score: '14 – 7', clock: 'Q2 · 4:50', network: 'CBS', current: 'false' },
{ matchup: 'Cowboys at Eagles', score: '7 – 3', clock: 'Q1 · 11:02', network: 'NBC', current: 'false' }
]
};
}
}
</script>
</body>
</html>
