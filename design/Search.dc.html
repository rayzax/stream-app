<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream: Global search results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D10;color:#E8EAED;font-family:Inter,system-ui,sans-serif}
a{color:#3B82F6}a:hover{color:#60A5FA}
h1,h2{font-family:"Space Grotesk",system-ui,sans-serif;margin:0;font-weight:700}
.tab{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:#9AA3AD;text-decoration:none;font-weight:500;border-bottom:2px solid transparent}
.search{box-sizing:border-box;width:100%;min-height:44px;padding:0 14px;background:#1C2128;color:#E8EAED;border:1px solid #3B82F6;border-radius:10px;font:inherit}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;background:#14181D;border:1px solid #1C2128;border-radius:10px;color:#E8EAED;text-decoration:none}
.row:hover{border-color:#2A313A;background:#1C2128}
.tag{flex:0 0 auto;font-size:12px;font-weight:600;color:#9AA3AD;background:#0B0D10;border:1px solid #2A313A;border-radius:999px;padding:3px 10px}
.tag-live{background:#EF4444;border-color:#EF4444;color:#fff;font-weight:700;letter-spacing:.04em}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="box-sizing:border-box;min-height:1000px;background:#0B0D10">
  <header style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 32px;padding:12px 32px;background:#14181D;border-bottom:1px solid #1C2128">
    <div style="font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:24px">Stream</div>
    <nav aria-label="Sections" style="display:flex;gap:4px">
      <a class="tab" href="Main.dc.html">Sports</a>
      <a class="tab" href="TV.dc.html">TV</a>
      <a class="tab" href="Movies.dc.html">Movies</a>
    </nav>
    <div style="flex:1 1 300px;max-width:520px;margin-left:auto">
      <label for="global-search" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search channels, shows, movies</label>
      <input id="global-search" class="search" type="search" value="chiefs" placeholder="Search channels, shows, movies…">
    </div>
    <button type="button" aria-label="User menu" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:#1C2128;color:#E8EAED;border:1px solid #2A313A;border-radius:999px;cursor:pointer">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
    </button>
  </header>

  <main style="box-sizing:border-box;max-width:960px;margin:0 auto;padding:28px 32px 40px;display:flex;flex-direction:column;gap:28px">
    <p style="margin:0;color:#9AA3AD;font-size:15px">Results for “chiefs”</p>
    <sc-for list="{{groups}}" as="grp">
      <section aria-labelledby="{{grp.id}}" style="display:flex;flex-direction:column;gap:10px">
        <h2 id="{{grp.id}}" style="font-size:18px">{{grp.title}} ({{grp.count}})</h2>
        <sc-for list="{{grp.items}}" as="it">
          <a class="row" href="{{it.href}}">
            <span style="flex:1 1 auto;min-width:0">
              <span style="display:block;font-weight:600">{{it.name}}</span>
              <span style="display:block;color:#9AA3AD;font-size:14px">{{it.meta}}</span>
            </span>
            <span class="{{it.tagClass}}">{{it.tag}}</span>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
return {
groups: [
{ id: 'g-live', title: 'Live sports', count: 1, items: [
{ name: 'Chiefs at Broncos', meta: 'Q2 · 4:50 · CBS', href: 'Player.dc.html', tag: 'LIVE', tagClass: 'tag tag-live' } ] },
{ id: 'g-tv', title: 'TV channels', count: 3, items: [
{ name: 'Channel 102', meta: 'Now: Talk Tonight', href: 'TV.dc.html', tag: 'TV', tagClass: 'tag' },
{ name: 'Channel 107', meta: 'Now: Game Show', href: 'TV.dc.html', tag: 'TV', tagClass: 'tag' },
{ name: 'Channel 111', meta: 'Now: Variety Show', href: 'TV.dc.html', tag: 'TV', tagClass: 'tag' } ] },
{ id: 'g-movies', title: 'Movies', count: 2, items: [
{ name: '[Movie title] 3', meta: '2013 · 118 min', href: 'Movies.dc.html', tag: 'MOVIE', tagClass: 'tag' },
{ name: '[Movie title] 9', meta: '2019 · 104 min', href: 'Movies.dc.html', tag: 'MOVIE', tagClass: 'tag' } ] }
]
};
}
}
</script>
</body>
</html>
