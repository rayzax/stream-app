services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      PORT: "8080"
      NODE_ENV: production
      STREAM_MODE: ${STREAM_MODE:-cloudrun}
      HOMELAB_PROXY_URL: ${HOMELAB_PROXY_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
